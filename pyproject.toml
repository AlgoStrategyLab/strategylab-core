[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab"
version = "0.1.0"
description = "A small, transparent daily-bar backtest harness for the AlgoStrategyLab series"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhinav Taduka"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy", "yfinance", "pyarrow"]

[tool.setuptools.packages.find]
include = ["strategylab*"]
